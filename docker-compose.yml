services:

  # ---------------- Microservicio (3 réplicas) ----------------
  api:
    build: ./api
    image: tp3-cloud-native-api
    environment:
      - PORT=3000
    # Sin "ports": las réplicas NO se publican al host.
    # Solo son accesibles dentro de la red interna, a través de NGINX.
    expose:
      - "3000"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.50"      # cada réplica puede usar como máximo medio núcleo
          memory: 256M
    healthcheck:
      # Health check activo: Docker consulta /health periódicamente.
      # Se usa 127.0.0.1 (no localhost) porque en Alpine "localhost"
      # puede resolver a IPv6 (::1) y la API escucha solo en IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  # ---------------- Balanceador de carga ----------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"             # único punto de entrada publicado al host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy   # arranca recién cuando las réplicas están sanas
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    name: tp3-backend     # nombre fijo, independiente de la carpeta del proyecto
    driver: bridge
