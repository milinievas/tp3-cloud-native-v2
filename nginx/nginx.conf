# ============================================================
# NGINX - Balanceador de carga / Proxy inverso del TP3
# ============================================================

worker_processes auto;            # un proceso worker por núcleo de CPU

events {
    # Máximo de conexiones simultáneas POR worker.
    # Ojo: cada petición proxyada usa 2 conexiones (cliente->nginx y nginx->api).
    worker_connections 4096;
}

http {
    # Log que muestra a qué réplica se envió cada petición ($upstream_addr)
    log_format balanceo '$remote_addr "$request" $status '
                        '-> $upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout balanceo;
    error_log  /dev/stderr warn;

    # ---------------- Grupo de réplicas (upstream) ----------------
    upstream api_backend {
        # "api" es el NOMBRE DEL SERVICIO en docker-compose.yml, no localhost.
        # El DNS interno de Docker resuelve "api" a las IPs de las 3 réplicas,
        # y NGINX crea un servidor por cada IP. Algoritmo por defecto: round-robin.
        #
        # Health check pasivo: si una réplica falla 3 veces en 10s,
        # se la saca de rotación durante 10s y luego se la vuelve a probar.
        server api:3000 max_fails=3 fail_timeout=10s;

        # Reutiliza conexiones abiertas hacia las réplicas (menos overhead TCP)
        keepalive 32;
    }

    server {
        listen 80;

        # Endpoint propio del balanceador (para saber si NGINX está vivo)
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "nginx OK\n";
        }

        # Todo lo demás se reenvía al grupo de réplicas
        location / {
            proxy_pass http://api_backend;

            # Necesario para que funcione keepalive hacia el upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Información del cliente original para la API
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Tiempos máximos de espera hacia la réplica
            proxy_connect_timeout 2s;
            proxy_read_timeout    5s;

            # Resiliencia: si una réplica falla, reintentar en otra
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            # Cabecera de evidencia: qué réplica (IP:puerto) respondió
            add_header X-Upstream-Server $upstream_addr always;
        }
    }
}
